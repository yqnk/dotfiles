$accent = rgb(129, 162, 190)
$accent2 = rgb(138, 190, 183)
$fg = rgb(196, 197, 200)
$fg-dim = rgb(140, 143, 150)
$bg-tint = rgba(18, 18, 32, 0.55)

background {
    monitor =
    path = screenshot
    color = rgb(18, 18, 32)

    blur_size = 7
    blur_passes = 3
    noise = 0.0117
    contrast = 1.1000
    brightness = 0.6500
    vibrancy = 0.2000
    vibrancy_darkness = 0.3
}

label {
    monitor =
    text = cmd[update:1000] sh -c 'printf "%(%H:%M)T"'
    color = $fg
    font_size = 95
    font_family = JetBrains Mono Nerd Font Bold 10
    position = 0, 90
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] sh -c 'printf "%(%A, %B %d)T"'
    color = $fg-dim
    font_size = 20
    font_family = JetBrains Mono Nerd Font 10
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:0] whoami
    color = $fg
    font_size = 18
    font_family = JetBrains Mono Nerd Font Bold 10
    position = 0, 128
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] sh -c 'sec=$(( $(date +%s) - $(date -d "$lockdate" +%s) )); \
      printf "locked %02d:%02d:%02d" $((sec/3600)) $(((sec%3600)/60)) $((sec%60))'
    color = $fg-dim
    font_size = 13
    font_family = JetBrains Mono Nerd Font 10
    position = 24, 24
    halign = left
    valign = bottom
}

input-field {
    monitor =
    size = 260, 50
    rounding = 25
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    outer_color = $accent
    inner_color = $bg-tint
    font_color = $fg
    fade_on_empty = true
    placeholder_text = <span foreground="##8c8f96"><i>Enter Password</i></span>
    capslock_color = $accent2
    hide_input = false
    position = 0, 60
    halign = center
    valign = bottom
}
