# vim:fileencoding=utf-8:foldmethod=marker
#
# Only the settings that differ from kitty's defaults. Every option is
# documented at https://sw.kovidgoyal.net/kitty/conf/ and by `kitty +runpy
# "from kitty.config import *; print(commented_out_default_config())"`.

include ./themes/tomorrow_night.conf

# fonts
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 10.0

# window
window_padding_width 2 0 2 8
placement_strategy top-left
background_opacity 0.7
confirm_os_window_close 0

# colors not covered by the theme
selection_foreground #c4c8c5
selection_background #333333

# cursor / bell
cursor_trail 1
cursor_trail_decay 0.1 0.3
enable_audio_bell no

# remote control, used by the nvim autocmd that drops the padding
allow_remote_control socket-only
listen_on unix:@mykitty-{kitty_pid}

# keys
map super no_op
map ctrl+equal change_font_size all +2.0
map ctrl+minus change_font_size all -2.0
map delete send_text all \x1b[3~
map ctrl+delete send_text all \x1b[3;5~

# let the compositor and the running program see the function keys
map f1 discard_event
map f2 discard_event
map f3 discard_event
map f4 discard_event
map f5 discard_event
map f6 discard_event
map f7 discard_event
map f8 discard_event
map f9 discard_event
map f10 discard_event
map f11 discard_event
map f12 discard_event

include tabs_azerty.conf
