# based on https://starship.rs/presets/pure-preset

"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_state\
$git_status\
$nix_shell\
$cmd_duration\
$line_break\
$jobs\
$character"""

[cmd_duration]
min_time = 2000
format = 'in [$duration]($style)'
style = '#e5c76b'

[directory]
style = "blue"
read_only = " [ro]"

[character]
success_symbol = "[➜](green)"
error_symbol = "[➜](red)"
vimcmd_symbol = "[-VIM-](green)"

[git_branch]
format = "[$branch]($style)"
style = "#e5c76b"

[git_status]
format = "[[( *$conflicted$untracked$modified$staged$renamed$deleted)](#ffafd7) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "#e5c76b"

[jobs]
symbol = "+"
style = '#e5c76b'

[nix_shell]
disabled = false
impure_msg = '[impure shell](bold cyan)'
pure_msg = '[pure shell](bold #ffafd7)'
unknown_msg = '[unknown shell](bold #e5c76b)'
symbol = ' '
format = 'via [$symbol$state( \($name\))](bold blue) '
